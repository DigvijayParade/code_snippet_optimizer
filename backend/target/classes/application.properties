spring.application.name=code_snippet_optimizer

# Database Configuration
spring.datasource.url=jdbc:h2:mem:snippetdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Enable H2 Console (so we can view our DB in the browser)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA Properties
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# JWT Secret (Used to sign our tokens securely)
jwt.secret=supersecretkeythatisverylongandsecureandisusedforsigningtokens123!
jwt.expirationMs=86400000
