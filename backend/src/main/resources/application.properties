spring.application.name=code_snippet_optimizer

# Local development database. The production profile uses PostgreSQL.
spring.datasource.url=jdbc:h2:mem:snippetdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Flyway owns schema changes; Hibernate checks mappings against the schema.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Supply a Base64-encoded random key with at least 32 bytes of entropy.
jwt.secret=${JWT_SECRET}
jwt.expirationMs=${JWT_EXPIRATION_MS:86400000}
